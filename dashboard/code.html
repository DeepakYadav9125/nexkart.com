<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexKart Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: Inter, system-ui, sans-serif; background:#f8fafc; color:#0f172a; }
  h1,h2 { font-family:"Hanken Grotesk", Inter, sans-serif; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; }
</style>
</head>
<body>
<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
    <div>
      <a class="text-2xl font-black text-emerald-700" href="/home_screen_dark_glassmorphism_live/code.html">NexKart</a>
      <p class="text-sm font-semibold text-slate-500">Admin backend dashboard</p>
    </div>
    <div class="flex items-center gap-2">
      <a class="rounded-xl border border-slate-200 px-4 py-2 font-bold text-slate-700" href="/home_screen_dark_glassmorphism_live/code.html">Store</a>
      <button class="rounded-xl bg-emerald-600 px-4 py-2 font-black text-white" id="refreshBtn">Refresh</button>
      <button class="rounded-xl bg-slate-900 px-4 py-2 font-black text-white" id="logoutBtn">Logout</button>
    </div>
  </div>
</header>

<section class="fixed inset-0 z-50 hidden place-items-center bg-slate-950/70 px-4 backdrop-blur" id="loginGate">
  <form class="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl" id="adminLoginForm">
    <div class="mb-6">
      <p class="text-sm font-black uppercase tracking-wide text-emerald-700">Admin Login</p>
      <h2 class="mt-1 text-3xl font-black">Dashboard Password</h2>
      <p class="mt-2 text-sm font-semibold text-slate-500">Username: <span class="text-slate-950">admin</span> · Password: <span class="text-slate-950">nexkart123</span></p>
    </div>
    <div class="grid gap-4">
      <label class="grid gap-2">
        <span class="text-sm font-bold text-slate-700">Username</span>
        <input class="rounded-2xl border border-slate-200 px-4 py-3 font-semibold focus:border-emerald-500 focus:ring-emerald-500/20" id="adminUsername" autocomplete="username" value="admin"/>
      </label>
      <label class="grid gap-2">
        <span class="text-sm font-bold text-slate-700">Password</span>
        <input class="rounded-2xl border border-slate-200 px-4 py-3 font-semibold focus:border-emerald-500 focus:ring-emerald-500/20" id="adminPassword" autocomplete="current-password" type="password" value="nexkart123"/>
      </label>
      <p class="hidden rounded-xl bg-rose-50 px-4 py-3 text-sm font-bold text-rose-700" id="loginError">Invalid username or password.</p>
      <button class="rounded-2xl bg-emerald-600 px-4 py-3 font-black text-white shadow-lg shadow-emerald-600/20" type="submit">LOGIN TO DASHBOARD</button>
    </div>
  </form>
</section>

<main class="mx-auto max-w-7xl px-4 py-6">
  <section class="mb-6">
    <h1 class="text-4xl font-black">Dashboard</h1>
    <p class="mt-1 text-slate-500">Live data from the new NexKart backend APIs.</p>
  </section>

  <section class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-5" id="metrics"></section>

  <section class="mt-6 grid grid-cols-1 gap-6 xl:grid-cols-[1.2fr_.8fr]">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-2xl font-black">Categories</h2>
        <a class="text-sm font-black text-emerald-700" href="/api/categories">API</a>
      </div>
      <div class="grid grid-cols-1 gap-3 md:grid-cols-2" id="categories"></div>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-2xl font-black">Low Stock</h2>
        <a class="text-sm font-black text-emerald-700" href="/api/products">API</a>
      </div>
      <div class="space-y-3" id="lowStock"></div>
    </div>
  </section>

  <section class="mt-6 grid grid-cols-1 gap-6 xl:grid-cols-[1fr_.9fr]">
    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-2xl font-black">Recent Orders</h2>
        <a class="text-sm font-black text-emerald-700" href="/api/orders">API</a>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full min-w-[620px] text-left text-sm">
          <thead class="border-b border-slate-200 text-slate-500">
            <tr><th class="py-3">Order</th><th>Customer</th><th>Status</th><th>Items</th><th>Total</th></tr>
          </thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-2xl font-black">Support</h2>
        <a class="text-sm font-black text-emerald-700" href="/api/tickets">API</a>
      </div>
      <div class="space-y-3" id="tickets"></div>
    </div>
  </section>
</main>

<script>
  const money = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 });

  function metric(icon, label, value, tone) {
    return `
      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="mb-4 flex h-11 w-11 items-center justify-center rounded-xl ${tone}">
          <span class="material-symbols-outlined">${icon}</span>
        </div>
        <p class="text-sm font-bold text-slate-500">${label}</p>
        <p class="mt-1 text-3xl font-black">${value}</p>
      </article>`;
  }

  async function ensureSession() {
    const session = await fetch("/api/session").then((response) => response.json());
    document.querySelector("#loginGate").classList.toggle("hidden", session.authenticated);
    document.querySelector("#loginGate").classList.toggle("grid", !session.authenticated);
    return session.authenticated;
  }

  async function loadDashboard() {
    if (!(await ensureSession())) return;
    const response = await fetch("/api/dashboard");
    if (response.status === 401) {
      document.querySelector("#loginGate").classList.remove("hidden");
      document.querySelector("#loginGate").classList.add("grid");
      return;
    }
    const data = await response.json();
    const { metrics } = data;

    document.querySelector("#metrics").innerHTML = [
      metric("payments", "Revenue", money.format(metrics.revenue), "bg-emerald-100 text-emerald-700"),
      metric("receipt_long", "Orders", metrics.orders, "bg-blue-100 text-blue-700"),
      metric("inventory_2", "Products", metrics.products, "bg-violet-100 text-violet-700"),
      metric("warehouse", "Stock Units", metrics.stock, "bg-amber-100 text-amber-700"),
      metric("support_agent", "Open Tickets", metrics.openTickets, "bg-rose-100 text-rose-700"),
    ].join("");

    document.querySelector("#categories").innerHTML = data.byCategory.map((category) => `
      <a class="rounded-xl border border-slate-200 p-4 transition hover:border-emerald-300 hover:bg-emerald-50" href="/product_listing_dark_mode/code.html?q=${encodeURIComponent(category.name)}">
        <div class="flex items-center justify-between gap-3">
          <p class="font-black">${category.name}</p>
          <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black">${category.count} products</span>
        </div>
        <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-100">
          <div class="h-full rounded-full bg-emerald-500" style="width:${Math.min(100, category.stock)}%"></div>
        </div>
        <p class="mt-2 text-sm font-semibold text-slate-500">${category.stock} units in stock</p>
      </a>`).join("");

    document.querySelector("#lowStock").innerHTML = data.lowStock.map((product) => `
      <div class="flex items-center justify-between rounded-xl bg-slate-50 p-3">
        <div>
          <p class="font-black">${product.name}</p>
          <p class="text-sm font-semibold text-slate-500">${product.category}</p>
        </div>
        <span class="rounded-full bg-amber-100 px-3 py-1 text-sm font-black text-amber-700">${product.stock}</span>
      </div>`).join("");

    document.querySelector("#orders").innerHTML = data.recentOrders.map((order) => `
      <tr class="border-b border-slate-100">
        <td class="py-4 font-black">${order.id}</td>
        <td class="font-semibold">${order.customer}</td>
        <td><span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-black text-emerald-700">${order.status}</span></td>
        <td class="font-semibold">${order.items}</td>
        <td class="font-black">${money.format(order.total)}</td>
      </tr>`).join("");

    document.querySelector("#tickets").innerHTML = data.tickets.map((ticket) => `
      <article class="rounded-xl border border-slate-200 p-4">
        <div class="flex items-center justify-between gap-3">
          <p class="font-black">${ticket.subject}</p>
          <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-black">${ticket.status}</span>
        </div>
        <p class="mt-1 text-sm font-semibold text-slate-500">${ticket.id} · ${ticket.type} · ${ticket.customer}</p>
      </article>`).join("");
  }

  document.querySelector("#refreshBtn").addEventListener("click", loadDashboard);
  document.querySelector("#logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    document.querySelector("#loginGate").classList.remove("hidden");
    document.querySelector("#loginGate").classList.add("grid");
  });
  document.querySelector("#adminLoginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const response = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: document.querySelector("#adminUsername").value,
        password: document.querySelector("#adminPassword").value,
      }),
    });
    document.querySelector("#loginError").classList.toggle("hidden", response.ok);
    if (response.ok) {
      document.querySelector("#loginGate").classList.add("hidden");
      document.querySelector("#loginGate").classList.remove("grid");
      await loadDashboard();
    }
  });
  loadDashboard();
</script>
</body>
</html>
