<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NexKart Travel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: Inter, system-ui, sans-serif; background:#f7fafc; color:#111827; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24; }
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <a class="font-black text-2xl text-blue-700" href="/home_screen_dark_glassmorphism_live/code.html">NexKart</a>
      <a class="flex items-center gap-2 rounded-xl bg-blue-600 px-4 py-2 text-white font-bold" href="/travel/code.html">
        <span class="material-symbols-outlined">flight</span>
        <span>Travel</span>
      </a>
    </div>
    <a class="flex items-center gap-2 text-slate-700 font-semibold" href="/my_account_dark_glassmorphism/code.html">
      <span class="material-symbols-outlined">card_travel</span>
      <span>My trips</span>
    </a>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8">
  <section class="rounded-2xl overflow-hidden bg-sky-200 min-h-32 flex items-center justify-between px-6 md:px-12">
    <div>
      <p class="font-bold text-blue-700 uppercase tracking-wide">NexKart Travel</p>
      <h1 class="text-3xl md:text-5xl font-black text-slate-900">Get lowest fares or 5X refund</h1>
    </div>
    <span class="material-symbols-outlined text-[92px] text-blue-700 hidden sm:block">flight_takeoff</span>
  </section>
  <section class="-mt-4 bg-white rounded-2xl shadow-xl border border-slate-200 p-5 md:p-7">
    <div class="flex justify-center -mt-12 mb-6">
      <div class="inline-flex bg-white rounded-full shadow border border-slate-200 p-1">
        <button class="flex items-center gap-2 px-5 py-3 rounded-full bg-blue-50 text-blue-700 font-bold"><span class="material-symbols-outlined">flight</span>Flights</button>
        <button class="flex items-center gap-2 px-5 py-3 rounded-full text-slate-600 font-semibold"><span class="material-symbols-outlined">hotel</span>Hotels</button>
        <button class="flex items-center gap-2 px-5 py-3 rounded-full text-slate-600 font-semibold"><span class="material-symbols-outlined">directions_bus</span>Buses</button>
      </div>
    </div>
    <div class="flex gap-6 mb-6 font-bold">
      <label class="flex items-center gap-2"><input checked name="trip" type="radio"/> One Way</label>
      <label class="flex items-center gap-2"><input name="trip" type="radio"/> Round Trip</label>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-5 border border-slate-200 rounded-2xl overflow-hidden">
      <label class="p-4 border-b md:border-b-0 md:border-r border-slate-200">
        <span class="text-sm text-slate-500">From</span>
        <input class="block w-full border-0 p-0 mt-2 text-xl font-black focus:ring-0" value="Delhi"/>
      </label>
      <label class="p-4 border-b md:border-b-0 md:border-r border-slate-200">
        <span class="text-sm text-slate-500">To</span>
        <input class="block w-full border-0 p-0 mt-2 text-xl font-black focus:ring-0" value="Mumbai"/>
      </label>
      <label class="p-4 border-b md:border-b-0 md:border-r border-slate-200">
        <span class="text-sm text-slate-500">Departure</span>
        <input class="block w-full border-0 p-0 mt-2 text-xl font-black focus:ring-0" type="date"/>
      </label>
      <label class="p-4 border-b md:border-b-0 md:border-r border-slate-200">
        <span class="text-sm text-slate-500">Return</span>
        <span class="block mt-2 text-lg font-bold text-slate-400">Add for discounts</span>
      </label>
      <label class="p-4">
        <span class="text-sm text-slate-500">Travelers & Class</span>
        <span class="block mt-2 text-xl font-black">1 Adult</span>
        <span class="block text-sm text-slate-500">Economy</span>
      </label>
    </div>
    <div class="flex justify-end mt-6">
      <button class="w-full md:w-auto rounded-xl bg-yellow-400 px-12 py-4 font-black text-slate-950 active:scale-95 transition">Search flights</button>
    </div>
  </section>
</main>
</body>
</html>
